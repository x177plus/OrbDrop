[package]
name = "orbdrop"
version = "0.1.0"
description = "OrbDrop — LAN file sharing tool"
authors = ["you"]
edition = "2021"

[lib]
name = "orbdrop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["ws"] }
tower-http = { version = "0.6", features = ["cors"] }
mdns-sd = "0.13"
# 本机网卡地址枚举（mdns-sd 本来就带着它，这里直接用同一份，不额外多编一份）：左下角
# 「端口 · 本机 IP」要显示内网地址，多网卡时还得把其余几个列出来。
if-addrs = "0.13"
sha2 = "0.10"
notify = "7"
quick-xml = "0.37"
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"
uuid = { version = "1", features = ["v4"] }
rand = "0.8"
thiserror = "1"
anyhow = "1"
tokio-util = "0.7"
base64 = "0.22"
aes-gcm = "0.10"
parking_lot = "0.12"
dirs = "5"
reqwest = { version = "0.12", features = ["stream", "json"] }
tokio-tungstenite = "0.29"
futures-util = "0.3"
pathdiff = "0.2"

[target.'cfg(windows)'.dependencies]
# 只为**迁移老数据**保留：老版本把配对 token 放在系统凭据库的一条里，启动时读它一次搬进
# 数据目录的凭据文件（见 credential::migrate_legacy_entry）。keyring 3 不带默认 store，
# 缺 feature 会退回进程内 mock（写成功、读为空），迁移会变成"什么都没读到"。
keyring = { version = "3", features = ["windows-native"] }
winreg = "0.52"
# `#[implement(...)]` 生成的代码里写的是 `windows_core::…` 这个 crate 名，
# 所以它必须作为**直接依赖**出现（和 `windows` 是同一份源码，不会重复编）。
windows-core = "0.61"
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Ole",
    # 盘符类型常量（DRIVE_FIXED / DRIVE_REMOVABLE / …）：本机选择框要按类型说
    # 「本地磁盘 / 可移动磁盘」，光有 Win32_Storage_FileSystem 里的 GetDriveTypeW 拿不到名字。
    "Win32_System_WindowsProgramming",
    "Win32_System_SystemServices",
    # 拖放诊断要认"光标下那个窗口属于哪个进程"：OpenProcess + QueryFullProcessImageNameW。
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
