[package]
name = "orbdrop"
version = "0.1.0"
description = "OrbDrop — LAN file sharing tool"
authors = ["you"]
edition = "2021"

[lib]
name = "orbdrop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["ws"] }
tower-http = { version = "0.6", features = ["cors"] }
mdns-sd = "0.13"
# 本机网卡地址枚举（mdns-sd 本来就带着它，这里直接用同一份，不额外多编一份）：左下角
# 「端口 · 本机 IP」要显示内网地址，多网卡时还得把其余几个列出来。
if-addrs = "0.13"
sha2 = "0.10"
notify = "7"
quick-xml = "0.37"
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"
uuid = { version = "1", features = ["v4"] }
rand = "0.8"
thiserror = "1"
anyhow = "1"
tokio-util = "0.7"
# 传输加密（TLS + 证书指纹 pinning）。**crypto provider 一律用 `ring`**：rustls 0.23 的默认
# provider 是 aws-lc-rs，它要现编一份 C（Windows 上还得有 NASM/CMake），为了一个自签证书把
# 构建链拉长不划算；ring 是纯 Rust 构建。三处（rustls / tokio-rustls / reqwest）选同一个，
# 混用会在运行时因为"provider 未安装"直接 panic。
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rustls-pki-types = "1"
rustls-pemfile = "2"
rcgen = { version = "0.13", default-features = false, features = ["crypto", "pem", "ring"] }
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
# 手写 accept 循环时要把 `axum::Router` 当成 hyper 的 service 调（`Service::call`）。
tower = { version = "0.5", features = ["util"] }
base64 = "0.22"
aes-gcm = "0.10"
parking_lot = "0.12"
dirs = "5"
# `rustls-tls-no-provider`：reqwest 不自带 crypto provider 决策 —— 由本机在启动时显式安装
# 一份（`net::install_crypto_provider`，用 `ring`），到对端那几条路再叠上装着 pinning
# 校验器的预配置 `rustls::ClientConfig`（见 `net::client_builder`）。
# 也因此**不再有 native-tls**：对一个只连内网自签证书的应用，系统信任库本就用不上。
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-no-provider", "stream", "json"] }
tokio-tungstenite = "0.29"
futures-util = "0.3"
pathdiff = "0.2"

[dev-dependencies]
# 集成测试里那个"老版本对端"桩要自己起一个 **TLS** 服务端（对端那一跳已经全是 TLS，
# 明文桩连不上）。直接用应用自己那份身份（`net::server_config`），免得测试里再编一套证书。
# 版本与 features 必须和 `[dependencies]` 里那份一致：两个 rustls 会被当成不同的 crate。
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.52"
# `#[implement(...)]` 生成的代码里写的是 `windows_core::…` 这个 crate 名，
# 所以它必须作为**直接依赖**出现（和 `windows` 是同一份源码，不会重复编）。
windows-core = "0.61"
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Storage_FileSystem",
    # CFAPI（云文件占位符）：拖出去的本地真实路径 + 水合时按需从对端拉，见 src/mirror/。
    "Win32_Storage_CloudFilters",
    # CF_CALLBACK_INFO / CF_OPERATION_INFO 里有 CORRELATION_VECTOR 字段，这一族必须一起开。
    "Win32_System_CorrelationVector",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Ole",
    # 盘符类型常量（DRIVE_FIXED / DRIVE_REMOVABLE / …）：本机选择框要按类型说
    # 「本地磁盘 / 可移动磁盘」，光有 Win32_Storage_FileSystem 里的 GetDriveTypeW 拿不到名字。
    "Win32_System_WindowsProgramming",
    "Win32_System_SystemServices",
    # 拖放诊断要认"光标下那个窗口属于哪个进程"：OpenProcess + QueryFullProcessImageNameW。
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
