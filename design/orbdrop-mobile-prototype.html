<!doctype html>
<!--
  OrbDrop · 移动端原型 (Open Design)
  Handheld shell derived from the Open Design mobile-app template (Apache-2.0).
  Product: conversations + receiving files, full-screen expanded state, no floating orb.
-->
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>OrbDrop · 移动端原型</title>
<style>
/* OD-LAYOUT-PRIMITIVES v1 — structure only: display, flex/grid, overflow, wrapping, ratio.
   Put this @layer first; product CSS outside the layer always wins. */
@layer od-layout {
  :where(.od-stack,.od-row,.od-row-top,.od-cluster,.od-grid,.od-field,.od-stat,.od-cell,.od-tile) > :where(*) { min-width: 0; }

  .od-stack   { display: flex; flex-direction: column; gap: var(--od-gap, 8px); }
  .od-row     { display: flex; align-items: center; gap: var(--od-gap, 8px); }
  .od-row-top { display: flex; align-items: flex-start; gap: var(--od-gap, 8px); }
  .od-cluster { display: flex; flex-wrap: wrap; align-items: center; gap: var(--od-gap, 8px); }
  .od-fill    { flex: 1 1 0; min-width: 0; }
  .od-fixed   { flex: none; }
  .od-grid    { display: grid; gap: var(--od-gap, 12px); grid-template-columns: repeat(var(--od-cols, 3), minmax(0, 1fr)); }

  .od-stat, .od-field, .od-cell { display: grid; gap: var(--od-gap, 2px); }
  :where(.od-stat,.od-field,.od-cell) > :where(*) { display: block; }
  .od-tile { display: grid; grid-template-rows: auto 1fr; }
  :where(.od-tile) > :where(*) { display: block; }

  .od-media { display: block; width: 100%; height: auto; aspect-ratio: var(--od-ratio, auto); }
  .od-media-cover { object-fit: cover; }

  .od-truncate { display: block; max-width: 100%; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .od-clamp-2, .od-clamp-3 { display: -webkit-box; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
  .od-clamp-2 { -webkit-line-clamp: 2; }
  .od-clamp-3 { -webkit-line-clamp: 3; }
  .od-lines-2 { min-height: calc(2 * 1.4em); }
  .od-nowrap  { white-space: nowrap; }
  .od-keep    { word-break: keep-all; overflow-wrap: anywhere; }

  .od-screen { display: grid; grid-template-rows: auto minmax(0, 1fr) auto; height: 100%; }
  .od-scroll { overflow-y: auto; overscroll-behavior: contain; min-height: 0; }

  .od-rail { display: flex; gap: var(--od-gap, 8px); overflow-x: auto; scroll-snap-type: x proximity; scrollbar-width: none;
             padding-inline: var(--od-rail-pad, 16px); scroll-padding-inline: var(--od-rail-pad, 16px); }
  .od-rail::-webkit-scrollbar { display: none; }
  :where(.od-rail) > :where(*) { flex: none; scroll-snap-align: start; }
  :where(.od-rail) > :where(:last-child) { margin-inline-end: var(--od-rail-pad, 16px); }

  .od-spacer { flex: none; visibility: hidden; pointer-events: none; }
  .od-touch  { min-width: 44px; min-height: 44px; }
}
/* /OD-LAYOUT-PRIMITIVES v1 */

/* ─────────────────────────── design tokens ───────────────────────────
   与桌面原型 orbdrop-app-prototype.html 共用同一套 modern-minimal 令牌。 */
:root {
  --bg:        oklch(99% 0.002 240);
  --surface:   oklch(100% 0 0);
  --surface-2: oklch(97.4% 0.004 245);
  --fg:        oklch(18% 0.012 250);
  --muted:     oklch(50% 0.012 250);
  --border:    oklch(92% 0.005 250);

  --accent:  oklch(58% 0.18 255);
  --ok:      oklch(52% 0.15 158);
  --warn:    oklch(58% 0.14 60);
  --danger:  oklch(56% 0.20 25);

  --accent-soft:  color-mix(in oklch, var(--accent) 12%, transparent);
  --accent-deep:  color-mix(in oklch, var(--accent) 78%, black);
  --accent-deeper: color-mix(in oklch, var(--accent) 70%, black);
  --ok-soft:      color-mix(in oklch, var(--ok) 13%, transparent);
  --fg-soft:      color-mix(in oklch, var(--fg) 6%, transparent);
  --hairline:     color-mix(in oklch, var(--fg) 20%, var(--border));
  --danger-soft:  color-mix(in oklch, var(--danger) 12%, transparent);
  --danger-deep:  color-mix(in oklch, var(--danger) 78%, black);

  --bc:      oklch(58% 0.15 38);
  --bc-soft: color-mix(in oklch, var(--bc) 13%, transparent);
  --bc-deep: color-mix(in oklch, var(--bc) 74%, black);
  --sp-1:    oklch(58% 0.18 255);
  --sp-2:    oklch(56% 0.14 158);
  --sp-3:    oklch(56% 0.16 320);
  --sp-1-deep: color-mix(in oklch, var(--sp-1) 74%, black);
  --sp-2-deep: color-mix(in oklch, var(--sp-2) 74%, black);
  --sp-3-deep: color-mix(in oklch, var(--sp-3) 74%, black);

  --font-display: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", "HarmonyOS Sans SC", "Microsoft YaHei UI", "Microsoft YaHei", system-ui, sans-serif;
  --font-body:    -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "HarmonyOS Sans SC", "Microsoft YaHei UI", "Microsoft YaHei", system-ui, sans-serif;
  --font-mono:    ui-monospace, "SF Mono", "JetBrains Mono", "Cascadia Code", Menlo, Consolas, monospace;

  --fs-xs: 12px;
  --fs-sm: 13px;
  --fs-md: 15px;
  --fs-lg: 16px;
  --fs-xl: 22px;

  --radius: 10px;
  --radius-lg: 16px;
  --shadow: 0 24px 64px -28px oklch(18% 0.012 250 / 0.22), 0 2px 8px -2px oklch(18% 0.012 250 / 0.08);
}
/* ─────────────────────────── base ─────────────────────────── */
*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; min-height: 100%; }
img, svg { display: block; }
button { font: inherit; cursor: pointer; color: inherit; background: none; border: 0; padding: 0; }
input { font: inherit; }
a { color: inherit; text-decoration: none; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
.num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }

/* ── handheld shell (platform-neutral) ─────────────────────────────── */
:root {
  --phone-screen-width: 390px;
  --phone-screen-height: 844px;
  --phone-bezel: 10px;
  --phone-outer-radius: 52px;
  --phone-screen-radius: 42px;
  --phone-safe-top: 50px;
  --phone-safe-bottom: 29px;
  --phone-system-fg: #17181a;
  --phone-screen-bg: #f8f8f9;
  --phone-stage-bg: #eaebee;
}
html, body { height: 100%; }
body {
  min-height: 100dvh;
  display: grid;
  place-items: center;
  padding: 32px;
  background:
    radial-gradient(circle at 50% 15%, rgba(255,255,255,.94), transparent 35%),
    var(--phone-stage-bg);
  color: #191a1d;
  font-family: var(--font-body);
}
.phone-frame {
  position: relative;
  width: calc(var(--phone-screen-width) + var(--phone-bezel) * 2);
  height: calc(var(--phone-screen-height) + var(--phone-bezel) * 2);
  padding: var(--phone-bezel);
  border-radius: var(--phone-outer-radius);
  background:
    linear-gradient(145deg, rgba(255,255,255,.2), transparent 17%),
    linear-gradient(160deg, #3f4146 0%, #202227 48%, #0b0c0f 100%);
  box-shadow:
    inset 0 0 0 1px rgba(255,255,255,.13),
    inset 0 0 0 2px rgba(0,0,0,.85),
    0 32px 68px -20px rgba(10,12,16,.52),
    0 10px 24px -10px rgba(10,12,16,.32);
  isolation: isolate;
}
.phone-frame::before,
.phone-frame::after {
  content: "";
  position: absolute;
  z-index: -1;
  top: 96px;
  bottom: 96px;
  width: 2px;
  background: linear-gradient(to bottom, transparent, rgba(255,255,255,.13) 16%, transparent 30%, transparent 72%, rgba(255,255,255,.07) 88%, transparent);
}
.phone-frame::before { left: 0; }
.phone-frame::after { right: 0; }
.hardware-button {
  position: absolute;
  width: 4px;
  border-radius: 3px;
  background: linear-gradient(90deg, #08090b, #2a2d33 60%, #08090b);
  box-shadow: inset 0 1px rgba(255,255,255,.08);
}
.hardware-button.volume { left: -3px; top: 222px; height: 86px; }
.hardware-button.power { right: -3px; top: 270px; height: 82px; }
.phone-screen {
  position: relative;
  width: var(--phone-screen-width);
  height: var(--phone-screen-height);
  overflow: hidden;
  border-radius: var(--phone-screen-radius);
  background: var(--phone-screen-bg);
  box-shadow: inset 0 0 0 1px rgba(255,255,255,.05);
}
.phone-content {
  position: absolute;
  inset: 0;
  overflow-x: hidden;
  overflow-y: auto;
  overscroll-behavior: contain;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
  padding-top: var(--phone-safe-top);
  padding-bottom: var(--phone-safe-bottom);
  background: var(--phone-screen-bg);
}
.phone-content::-webkit-scrollbar { display: none; }
.camera-dot {
  position: absolute;
  z-index: 20;
  top: 13px;
  left: 50%;
  width: 10px;
  height: 10px;
  transform: translateX(-50%);
  border-radius: 50%;
  background: radial-gradient(circle at 38% 35%, #344154 0 12%, #0a0c10 34%, #000 76%);
  box-shadow: 0 0 0 1px rgba(255,255,255,.06);
  pointer-events: none;
}
.status-bar {
  position: absolute;
  z-index: 15;
  inset: 0 0 auto;
  height: var(--phone-safe-top);
  display: grid;
  grid-template-columns: minmax(0, 1fr) 56px minmax(0, 1fr);
  align-items: start;
  padding: 14px 20px 0;
  color: var(--phone-system-fg);
  opacity: .8;
  pointer-events: none;
}
.status-time { justify-self: start; display: flex; align-items: center; height: 15px; font-size: 14px; font-weight: 560; line-height: 1; }
.status-cutout-zone { width: 56px; }
.status-icons { justify-self: end; display: inline-flex; align-items: center; height: 15px; gap: 6px; }
.status-icons svg { display: block; flex: none; fill: none; stroke: currentColor; stroke-width: 1.35; stroke-linecap: round; stroke-linejoin: round; }
.status-icons .connectivity { width: 15px; height: 12px; }
.status-icons .wifi { width: 15px; height: 12px; }
.status-icons .battery { width: 19px; height: 11px; }
.gesture-indicator {
  position: absolute;
  z-index: 20;
  left: 50%;
  bottom: 8px;
  width: 96px;
  height: 4px;
  transform: translateX(-50%);
  border-radius: 99px;
  background: var(--phone-system-fg);
  opacity: .86;
  pointer-events: none;
}
@media (max-height: 927px) { .phone-frame { zoom: 0.9; } }
@media (max-height: 840px) { .phone-frame { zoom: 0.82; } }
@media (max-height: 771px) { .phone-frame { zoom: 0.74; } }
@media (max-height: 702px) { .phone-frame { zoom: 0.66; } }
@media (max-width: 480px) {
  body { padding: 0; display: block; }
  .phone-frame { width: 100%; height: 100dvh; padding: 0; border-radius: 0; background: none; box-shadow: none; zoom: 1; }
  .phone-frame::before, .phone-frame::after, .hardware-button { display: none; }
  .phone-screen { width: 100%; height: 100%; border-radius: 0; }
}
/* ─────────────────────────── icons ─────────────────────────── */
.ic { width: 20px; height: 20px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.ic-fill { fill: currentColor; stroke: none; }

/* ─────────────────────────── app frame ─────────────────────────── */
.app {
  position: relative;
  height: 100%;
  display: grid;
  grid-template-rows: auto minmax(0, 1fr) auto;
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-body);
  font-size: var(--fs-lg);
  line-height: 1.55;
  overflow: hidden;
}
.appbar {
  flex: none;
  display: flex;
  align-items: flex-start;
  gap: 12px;
  padding: 16px 18px 12px;
  background: var(--bg);
  border-bottom: 1px solid var(--border);
}
.ab-main { flex: 1; min-width: 0; display: grid; gap: 2px; }
.ab-title { margin: 0; font-family: var(--font-display); font-size: var(--fs-xl); font-weight: 650; letter-spacing: -0.02em; line-height: 1.15; }
.ab-sub { margin: 0; font-size: var(--fs-xs); color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ab-acts { flex: none; display: flex; gap: 4px; margin-top: 3px; }

.icon-btn {
  width: 40px; height: 40px; flex: none; border-radius: 11px;
  display: grid; place-items: center; color: var(--muted);
  transition: background .15s ease, color .15s ease;
}
.icon-btn .ic { width: 21px; height: 21px; }
.icon-btn:hover { background: var(--fg-soft); color: var(--fg); }
.icon-btn:active { transform: scale(.95); }

.appmain { overflow-y: auto; overscroll-behavior: contain; min-height: 0; scrollbar-width: none; }
.appmain::-webkit-scrollbar { display: none; }

/* ─────────────────────────── bottom navigation ─────────────────────────── */
.tabbar {
  flex: none;
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 2px;
  padding: 6px 6px 4px;
  background: var(--surface);
  border-top: 1px solid var(--border);
}
.tab-item {
  position: relative;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
  min-height: 54px; border-radius: 12px;
  color: var(--muted); font-size: 11px; font-weight: 560;
  transition: color .15s ease, background .15s ease;
}
.tab-item:hover { background: var(--fg-soft); color: var(--fg); }
.tab-item.active { color: var(--accent-deep); background: var(--accent-soft); }
.tab-item.active:hover { background: color-mix(in oklch, var(--accent) 18%, transparent); color: var(--accent-deep); }
.ti-ic { position: relative; display: grid; place-items: center; }
.ti-ic .ic { width: 23px; height: 23px; }
.ti-badge {
  position: absolute; top: -4px; right: -10px;
  min-width: 17px; height: 17px; padding: 0 4px;
  border-radius: 99px; background: var(--accent); color: #fff;
  font-family: var(--font-mono); font-size: 10px; font-weight: 700; line-height: 17px; text-align: center;
}
.ti-badge.hot { background: var(--bc); }

/* ─────────────────────────── generic pieces ─────────────────────────── */
.body { padding: 14px 18px 26px; }
.sec + .sec { margin-top: 20px; }
.sec-label {
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  padding: 0 2px 8px; font-size: var(--fs-xs); font-weight: 620; color: var(--muted); letter-spacing: .01em;
}
.sec-label .num { font-family: var(--font-mono); font-weight: 400; }
.stack { display: grid; gap: 2px; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); }
.card.list { overflow: hidden; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 7px;
  height: 42px; padding: 0 16px; border-radius: 11px; border: 1px solid transparent;
  font-size: var(--fs-md); font-weight: 600; white-space: nowrap;
  transition: background .15s ease, border-color .15s ease, color .15s ease;
}
.btn .ic { width: 16px; height: 16px; }
.btn-primary { background: var(--accent); color: #fff; }
.btn-primary:hover { background: var(--accent-deep); }
.btn-secondary { background: var(--surface); border-color: var(--border); color: var(--fg); }
.btn-secondary:hover { background: var(--fg-soft); border-color: var(--hairline); }
.btn-danger { background: var(--danger-soft); color: var(--danger-deep); }
.btn-danger:hover { background: color-mix(in oklch, var(--danger) 20%, transparent); }
.btn-block { width: 100%; }
.btn-sm { height: 34px; padding: 0 12px; font-size: var(--fs-sm); border-radius: 9px; }

.dot { flex: none; width: 7px; height: 7px; border-radius: 50%; background: var(--muted); }
.dot.ok { background: var(--ok); }
.dot.warn { background: var(--warn); }
.dot.off { background: color-mix(in oklch, var(--fg) 26%, transparent); }
.dot.bc { background: var(--bc); }

.empty { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 44px 24px; text-align: center; color: var(--muted); }
.empty .ic { width: 30px; height: 30px; opacity: .45; }
.empty p { margin: 0; font-size: var(--fs-md); }
.empty .es { font-size: var(--fs-xs); max-width: 250px; line-height: 1.6; }

.chip {
  display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 12px;
  border-radius: 99px; border: 1px solid var(--border); background: var(--surface);
  font-size: var(--fs-sm); color: var(--fg); flex: none;
}
.chip .ic { width: 15px; height: 15px; }
.chip.active { border-color: var(--accent); background: var(--accent-soft); color: var(--accent-deep); font-weight: 600; }
/* ─────────────────────────── conversation list ─────────────────────────── */
.convo {
  width: 100%; display: flex; align-items: center; gap: 12px;
  padding: 11px 10px; border-radius: 14px; text-align: left;
  transition: background .15s ease;
}
.convo:hover { background: var(--fg-soft); }
.av {
  flex: none; width: 46px; height: 46px; border-radius: 14px;
  display: grid; place-items: center;
  font-family: var(--font-display); font-size: 18px; font-weight: 650;
}
.av .ic { width: 22px; height: 22px; }
.av.dir { background: var(--accent-soft); color: var(--accent-deep); }
.av.grp { background: var(--accent-deep); color: var(--surface); }
.av.bc  { background: var(--bc-soft); color: var(--bc-deep); }
.cv-main { flex: 1; min-width: 0; display: grid; gap: 3px; }
.cv-top { display: flex; align-items: center; gap: 6px; min-width: 0; }
.cv-name {
  flex: 0 1 auto; min-width: 0;
  font-family: var(--font-display); font-size: var(--fs-lg); font-weight: 600; letter-spacing: -0.01em;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.cv-mode { flex: none; display: inline-flex; align-items: center; gap: 3px; height: 18px; padding: 0 7px; border-radius: 99px; font-size: 10px; font-weight: 620; }
.cv-mode .ic { width: 11px; height: 11px; }
.cv-mode.bc { background: var(--bc-soft); color: var(--bc-deep); }
.cv-mode.grp { background: var(--accent-soft); color: var(--accent-deep); }
.cv-dot { flex: none; width: 7px; height: 7px; border-radius: 50%; background: color-mix(in oklch, var(--fg) 24%, transparent); }
.cv-dot.ok { background: var(--ok); }
.cv-dot.warn { background: var(--warn); }
.cv-time { margin-left: auto; flex: none; font-family: var(--font-mono); font-size: 11px; color: var(--muted); }
.cv-prev { font-size: var(--fs-sm); color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cv-unread {
  flex: none; min-width: 20px; height: 20px; padding: 0 6px; border-radius: 99px;
  background: var(--accent); color: #fff; font-family: var(--font-mono); font-size: 11px; font-weight: 700;
  display: grid; place-items: center;
}
.convo.bc .cv-unread { background: var(--bc); }

/* ─────────────────────────── chat subscreen ─────────────────────────── */
.sub {
  position: absolute; inset: 0; z-index: 6;
  display: flex; flex-direction: column;
  background: var(--bg);
  transform: translateX(12%); opacity: 0; visibility: hidden; pointer-events: none;
  transition: transform .28s cubic-bezier(.2,.8,.2,1), opacity .2s ease, visibility .28s;
}
.sub.open { transform: none; opacity: 1; visibility: visible; pointer-events: auto; }
.chatbar { flex: none; display: flex; align-items: center; gap: 8px; padding: 11px 12px; background: var(--bg); border-bottom: 1px solid var(--border); }
.cb-main { flex: 1; min-width: 0; display: grid; gap: 2px; }
.cb-title { font-family: var(--font-display); font-size: var(--fs-lg); font-weight: 620; letter-spacing: -0.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cb-sub { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--muted); }
.chat-banner { flex: none; display: flex; align-items: flex-start; gap: 8px; padding: 9px 14px; font-size: var(--fs-xs); line-height: 1.5; }
.chat-banner .ic { width: 15px; height: 15px; flex: none; margin-top: 1px; }
.chat-banner.bc { background: var(--bc-soft); color: var(--bc-deep); }
.chat-banner.grp { background: var(--accent-soft); color: var(--accent-deep); }

.chatlog {
  flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain;
  padding: 14px 14px 12px; display: flex; flex-direction: column; gap: 10px;
  scrollbar-width: none;
}
.chatlog::-webkit-scrollbar { display: none; }
.chatlog > .empty { margin: auto; }
.msg { display: flex; flex-direction: column; max-width: 84%; }
.msg.me { align-self: flex-end; align-items: flex-end; }
.msg.peer { align-self: flex-start; align-items: flex-start; }
.bubble {
  max-width: 100%; padding: 9px 12px; border-radius: 16px;
  font-size: var(--fs-md); line-height: 1.55; overflow-wrap: anywhere;
  user-select: text; -webkit-user-select: text;
}
.msg.peer .bubble { background: var(--surface-2); color: var(--fg); border-bottom-left-radius: 6px; }
.msg.me .bubble { background: var(--accent-deep); color: #fff; border-bottom-right-radius: 6px; }
.msg.bc .bubble { background: var(--bc-deep); }
.ctext { display: block; white-space: pre-wrap; }
.meta { margin-top: 4px; font-family: var(--font-mono); font-size: 10px; color: var(--muted); }
.who { display: flex; align-items: center; gap: 5px; margin: 0 2px 4px; }
.who .who-av {
  flex: none; width: 18px; height: 18px; border-radius: 6px;
  display: grid; place-items: center; color: #fff;
  font-family: var(--font-display); font-size: 10px; font-weight: 700;
}
.who .who-nm { font-family: var(--font-display); font-size: 11px; font-weight: 620; }
.who.sp-1 .who-av { background: var(--sp-1-deep); }

<script>
(function () {
  'use strict';

  var appbar = document.getElementById('appbar');
  var appmain = document.getElementById('appmain');
  var tabbar = document.getElementById('tabbar');
  var chatScreen = document.getElementById('chatScreen');
  var scrim = document.getElementById('scrim');
  var sheetLayer = document.getElementById('sheetLayer');
  var toasts = document.getElementById('toasts');

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function ic(id, cls) {
    return '<svg class="ic' + (cls ? ' ' + cls : '') + '" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-' + id + '"/></svg>';
  }
  function nowHM() {
    var d = new Date();
    return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
  }
  function kindOf(name) {
    var e = String(name).split('.').pop().toLowerCase();
    if (['png', 'jpg', 'jpeg', 'gif', 'webp', 'svg', 'heic'].indexOf(e) > -1) return 'image';
    if (['zip', 'rar', '7z', 'tar', 'gz'].indexOf(e) > -1) return 'zip';
    return 'doc';
  }
  function iconOf(name) {
    var k = kindOf(name);
    return k === 'image' ? 'image' : k === 'zip' ? 'zip' : 'file';
  }

  /* ── state ───────────────────────────────────────────────────── */
  var state = {
    tab: 'convos',
    filesSeg: 'inbox',
    openChat: null,
    draft: {},
    seq: 0,
    devices: [
      { id: 'd1', name: 'PC-B', ip: '192.168.1.6:3890', state: 'connected', av: 'B' },
      { id: 'd2', name: 'PC-C', ip: '192.168.1.4:3891', state: 'paired', av: 'C' },
      { id: 'd3', name: 'MacBook Pro', ip: '192.168.1.9:3890', state: 'unbound', av: 'M' }
    ],
    threads: {
      g1: { id: 'g1', mode: 'group', name: '发布联调', participants: ['d1', 'd2', 'd3'] },
      b1: { id: 'b1', mode: 'broadcast', name: '发布包 v0.5', participants: ['d1', 'd2', 'd3'] }
    },
    order: ['dev:d1', 'dev:d3', 'g1', 'b1'],
    unread: { 'dev:d1': 2, 'dev:d3': 1 },
    store: {
      'dev:d1': [
        { from: 'peer', kind: 'text', text: '设计稿收到了，先在 assets 里对一遍色板。', t: '10:18' },
        { from: 'me', kind: 'text', text: '好，重点看主色和中性色的对比，不合适的直接标出来。', t: '10:20', status: '已读' },
        { from: 'peer', kind: 'file', name: '色板-修订.png', size: '128 KB', t: '10:22' },
        { from: 'peer', kind: 'text', text: '标了三处，最大的一处落在按钮悬停态上。', t: '10:22' }
      ],
      'dev:d3': [
        { from: 'peer', kind: 'text', text: '在吗？帮我传一下「Q3 排期表」。', t: '10:11' },
        { from: 'peer', kind: 'invite', name: '接口清单.xlsx', size: '1.1 MB', t: '10:12', inviteState: 'pending', fromName: 'MacBook Pro' }
      ],
      g1: [
        { from: 'me', kind: 'text', text: '发布包我一起推给你们三台，先在群里同步一下。', t: '10:05', status: '已送达' },
        { from: 'peer', fromName: 'MacBook Pro', kind: 'text', text: '收到，我先在素材仓库对一版。', t: '10:07' },
        { from: 'peer', fromName: 'PC-B', kind: 'text', text: '好，文件到了我就跑冒烟。', t: '10:08' },
        { from: 'peer', fromName: 'PC-C', kind: 'text', text: '我这边网络刚恢复，也一起看。', t: '10:09' }
      ],
      b1: [
        { from: 'me', kind: 'text', text: 'v0.5 发布包已放到共享项「项目设计稿」，请各位各拉一份。', t: '09:30' },
        { from: 'me', kind: 'file', name: '发布包-v0.5.zip', size: '86 MB', t: '09:31', transfer: { state: 'done', total: 2, offline: 1, pct: 100 } },
        { from: 'me', kind: 'text', text: '验收请走「引用模式」直连比较，不用先下载到本地。', t: '09:33' }
      ]
    },
    inbox: [
      { id: 'f1', name: '色板-修订.png', size: '128 KB', from: 'PC-B', time: '今天 10:22', kind: 'image' },
      { id: 'f2', name: '发布包-v0.5.zip', size: '86 MB', from: 'PC-B', time: '今天 09:31', kind: 'zip' },
      { id: 'f3', name: '交付清单.md', size: '32 KB', from: 'PC-C', time: '昨天', kind: 'doc' },
      { id: 'f4', name: 'home-v3.fig', size: '4.2 MB', from: 'PC-C', time: '昨天', kind: 'doc' }
    ],
    transfers: [
      { id: 't1', name: '发布包-v0.5.zip', size: '86 MB', peer: 'PC-B', dir: 'out', pct: 62, state: 'active' },
      { id: 't2', name: '接口清单.xlsx', size: '1.1 MB', peer: 'MacBook Pro', dir: 'in', pct: 100, state: 'done' }
    ],
    browseDev: 'd1',
    browseOpen: {},
    settings: {
      name: '我的手机', ip: '192.168.1.10:3890', port: '3890',
      inboxDir: '~/OrbDrop/收件', downloadDir: '~/Downloads/OrbDrop',
      downloadMode: 'direct', keepAlive: true, autostart: false
    }
  };

  var REMOTE = {
    d1: [
      { name: '素材仓库', folder: true, meta: '2.4 GB · 18 个文件', children: [
        { name: '主视觉', folder: true, meta: '6 项', children: [
          { name: 'home-v3.fig', folder: false, meta: '4.2 MB' },
          { name: 'kv-og.png', folder: false, meta: '820 KB' }
        ] },
        { name: '交付清单.md', folder: false, meta: '32 KB' }
      ] },
      { name: '发布包-v0.5.zip', folder: false, meta: '86 MB' }
    ],
    d2: [
      { name: 'Mac 设计稿', folder: true, meta: '1.2 GB · 9 个文件', children: [
        { name: 'tokens.json', folder: false, meta: '12 KB' },
        { name: 'home-v3.fig', folder: false, meta: '4.2 MB' }
      ] }
    ],
    d3: []
  };

  /* ── helpers ─────────────────────────────────────────────────── */
  function dev(id) { return state.devices.filter(function (d) { return d.id === id; })[0] || null; }
  function devName(id) { var d = dev(id); return d ? d.name : id; }
  function onlineDeviceList() { return state.devices.filter(function (d) { return d.state === 'connected'; }); }
  function onlineCountAll() { return onlineDeviceList().length; }
  function totalUnread() {
    return convoKeys().reduce(function (n, k) { return n + (state.unread[k] || 0); }, 0);
  }
  function partOf(key) {
    if (key.indexOf('dev:') === 0) return [key.slice(4)];
    var t = state.threads[key];
    return t ? t.participants.slice() : [];
  }
  function modeOf(key) {
    if (key.indexOf('dev:') === 0) return 'direct';
    var t = state.threads[key];
    return t ? t.mode : 'direct';
  }
  function nameOfThread(key) { var t = state.threads[key]; return (t && t.name) || ''; }
  function titleOf(key) {
    var m = modeOf(key);
    if (m === 'broadcast') return '群发 · ' + (nameOfThread(key) || '未命名群发');
    if (m === 'group' && nameOfThread(key)) return '群聊 · ' + nameOfThread(key);
    return partOf(key).map(devName).join('、');
  }
  function validConvo(key) {
    if (!key) return false;
    if (key.indexOf('dev:') === 0) return !!dev(key.slice(4));
    var t = state.threads[key];
    return !!t && t.participants.length >= 2;
  }
  function msgs(key) { if (!state.store[key]) state.store[key] = []; return state.store[key]; }
  function lastVisible(key) {
    var a = msgs(key);
    if (modeOf(key) === 'broadcast') {
      for (var i = a.length - 1; i >= 0; i--) if (a[i].from === 'me') return a[i];
      return null;
    }
    return a.length ? a[a.length - 1] : null;
  }
  function onlineCount(key) {
    return partOf(key).filter(function (id) { var d = dev(id); return d && d.state === 'connected'; }).length;
  }
  function dotState(key) {
    if (onlineCount(key) > 0) return 'ok';
    var f = dev(partOf(key)[0]);
    return f && f.state === 'unbound' ? 'warn' : 'off';
  }
  function receiptOf(key) {
    var ids = partOf(key), states = {}, delivered = 0;
    ids.forEach(function (id) {
      var d = dev(id), ok = !!(d && d.state === 'connected');
      states[id] = ok ? 'ok' : 'off';
      if (ok) delivered++;
    });
    return { total: ids.length, delivered: delivered, offline: ids.length - delivered, states: states };
  }
  function convoKeys() {
    var keys = state.order.filter(validConvo);
    state.devices.forEach(function (d) { var k = 'dev:' + d.id; if (validConvo(k) && keys.indexOf(k) < 0) keys.push(k); });
    Object.keys(state.threads).forEach(function (t) { if (validConvo(t) && keys.indexOf(t) < 0) keys.push(t); });
    return keys;
  }
  function convoLastTime(key) { var m = lastVisible(key); return m ? m.t : ''; }
  function summary(key) {
    var m = lastVisible(key);
    if (!m) return '还没有消息';
    if (modeOf(key) === 'broadcast') {
      var r = receiptOf(key);
      return '已送达 ' + r.delivered + '/' + r.total + ' 台 · ' + (m.kind === 'file' ? '[文件] ' + m.name : m.text);
    }
    var lead = m.from === 'me' ? '你：' : (m.fromName ? m.fromName + '：' : '');
    return lead + (m.kind === 'file' || m.invite ? '[文件] ' + m.name : m.text);
  }
  function pendingInvites() {
    var out = [];
    Object.keys(state.store).forEach(function (key) {
      msgs(key).forEach(function (m, i) {
        if (m.invite && m.inviteState === 'pending') out.push({ key: key, idx: i, m: m });
      });
    });
    return out;
  }
  function activeTransfers() { return state.transfers.filter(function (t) { return t.state === 'active'; }); }
  function speakerIdx(name) {
    var h = 0, s = String(name || '?');
    for (var i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) % 997;
    return (h % 3) + 1;
  }
  function speakerInitial(name) { return String(name || '?').trim().charAt(0); }

  /* ── conversation item ───────────────────────────────────────── */
  function convoItemHTML(key) {
    var mode = modeOf(key), parts = partOf(key);
    var av = mode === 'broadcast' ? '<span class="av bc">' + ic('bc') + '</span>'
      : mode === 'group' ? '<span class="av grp">' + ic('group') + '</span>'
      : '<span class="av dir">' + esc(dev(parts[0]) ? dev(parts[0]).av : '?') + '</span>';
    var chip = mode === 'broadcast' ? '<span class="cv-mode bc">' + ic('bc') + '群发</span>'
      : mode === 'group' ? '<span class="cv-mode grp">' + ic('group') + '群聊</span>' : '';
    var unread = state.unread[key] || 0;
    return '<button class="convo' + (mode === 'broadcast' ? ' bc' : '') + '" type="button" data-act="open" data-key="' + esc(key) + '">' +
      av +
      '<span class="cv-main"><span class="cv-top"><span class="cv-name">' + esc(titleOf(key)) + '</span>' + chip +
      '<span class="cv-dot ' + dotState(key) + '"></span><span class="cv-time num">' + esc(convoLastTime(key)) + '</span></span>' +
      '<span class="cv-prev">' + esc(summary(key)) + '</span></span>' +
      (unread ? '<span class="cv-unread num">' + unread + '</span>' : '') +
      '</button>';
  }

  /* ── appbar / tabbar ─────────────────────────────────────────── */
  function renderAppbar() {
    var cfg = {
      convos: { title: '会话', sub: onlineCountAll() + ' 台在线 · ' + state.devices.length + ' 台设备', acts: [['newConvo', 'plus', '新建会话']] },
      files: { title: '文件', sub: pendingInvites().length + ' 个待接收 · ' + state.inbox.length + ' 个已接收', acts: [['refresh', 'refresh', '刷新']] },
      devices: { title: '设备', sub: '本机 · ' + state.settings.ip, acts: [['addDevice', 'plus', '手动添加设备']] },
      settings: { title: '设置', sub: 'OrbDrop 移动端 · 需求 v0.5', acts: [] }
    }[state.tab];
    appbar.innerHTML =
      '<div class="ab-main"><h1 class="ab-title">' + cfg.title + '</h1><p class="ab-sub">' + esc(cfg.sub) + '</p></div>' +
      (cfg.acts.length ? '<div class="ab-acts">' + cfg.acts.map(function (a) {
        return '<button class="icon-btn" type="button" data-act="' + a[0] + '" aria-label="' + a[2] + '">' + ic(a[1]) + '</button>';
      }).join('') + '</div>' : '');
  }
  function renderTabbar() {
    var tabs = [
      { id: 'convos', label: '会话', icon: 'chat', badge: totalUnread() },
      { id: 'files', label: '文件', icon: 'files', badge: pendingInvites().length, hot: true },
      { id: 'devices', label: '设备', icon: 'devices' },
      { id: 'settings', label: '设置', icon: 'settings' }
    ];
    tabbar.innerHTML = tabs.map(function (t) {
      var on = state.tab === t.id;
      return '<button class="tab-item' + (on ? ' active' : '') + '" type="button" role="tab" aria-selected="' + on + '" data-act="tab" data-tab="' + t.id + '">' +
        '<span class="ti-ic">' + ic(t.icon) + (t.badge ? '<span class="ti-badge' + (t.hot ? ' hot' : '') + '">' + t.badge + '</span>' : '') + '</span>' +
        '<span class="ti-lb">' + t.label + '</span>' +
        '</button>';
    }).join('');
  }

  /* ── views ───────────────────────────────────────────────────── */
  function renderConvos() {
    var keys = convoKeys();
    if (!keys.length) {
      return '<div class="body"><div class="empty">' + ic('chat') + '<p>还没有会话</p><p class="es">先在设备页配对或连接一台设备，再发起会话。</p></div></div>';
    }
    return '<div class="body"><div class="stack">' + keys.map(convoItemHTML).join('') + '</div></div>';
  }
  function segBtn(id, label, n) {
    var on = state.filesSeg === id;
    return '<button class="seg-item' + (on ? ' active' : '') + '" type="button" role="tab" aria-selected="' + on + '" data-act="seg" data-seg="' + id + '">' +
      label + (n ? '<span class="segn num">' + n + '</span>' : '') + '</button>';
  }
  function renderFiles() {
    var seg = '<div class="seg" role="tablist" aria-label="文件视图">' +
      segBtn('inbox', '收件', state.inbox.length + pendingInvites().length) +
      segBtn('transfer', '传输', activeTransfers().length) +
      segBtn('browse', '浏览', 0) +
      '</div>';
    var body = state.filesSeg === 'inbox' ? filesInboxHTML() : (state.filesSeg === 'transfer' ? filesTransferHTML() : filesBrowseHTML());
    return seg + body;
  }
  function pendingCardHTML(p) {
    var m = p.m;
    var from = m.fromName || devName(partOf(p.key)[0]);
    return '<div class="pend">' +
      '<div class="pend-top"><span class="pend-chip">' + ic('download') + '待接收</span><span class="pend-who">来自 ' + esc(from) + '</span></div>' +
      '<div class="pend-body"><span class="ftile ' + kindOf(m.name) + '">' + ic(iconOf(m.name)) + '</span>' +
      '<span class="fmain"><span class="fname2">' + esc(m.name) + '</span><span class="fmeta">' + esc(m.size || '文件') + ' · 保存到收件目录</span></span></div>' +
      '<div class="pend-acts"><button class="btn btn-secondary" type="button" data-act="invite" data-key="' + esc(p.key) + '" data-i="' + p.idx + '" data-yes="0">拒绝</button>' +
      '<button class="btn btn-primary" type="button" data-act="invite" data-key="' + esc(p.key) + '" data-i="' + p.idx + '" data-yes="1">接收</button></div>' +
      '</div>';
  }
  function inboxRowHTML(f) {
    return '<button class="frow" type="button" data-act="fileMore" data-id="' + f.id + '">' +
      '<span class="ftile ' + kindOf(f.name) + '">' + ic(iconOf(f.name)) + '</span>' +
      '<span class="fmain"><span class="fname2">' + esc(f.name) + '</span><span class="fmeta">' + esc(f.from) + ' · ' + esc(f.size) + ' · ' + esc(f.time) + '</span></span>' +
      '<span class="fgo" aria-hidden="true">' + ic('more', 'ic-fill') + '</span>' +
      '</button>';
  }
  function filesInboxHTML() {
    var pend = pendingInvites(), h = '<div class="body">';
    if (pend.length) {
      h += '<div class="sec"><div class="sec-label"><span>待接收</span><span class="num">' + pend.length + ' 个</span></div>' +
        '<div class="stack">' + pend.map(pendingCardHTML).join('') + '</div></div>';
    }
    h += '<div class="sec"><div class="sec-label"><span>已接收文件</span><span class="num">' + state.inbox.length + ' 个</span></div>';
    h += state.inbox.length
      ? '<div class="card list">' + state.inbox.map(inboxRowHTML).join('') + '</div>'
      : '<div class="card list"><div class="empty">' + ic('inbox') + '<p>还没有收到的文件</p><p class="es">收到推送并同意后，文件会落到收件目录并出现在这里。</p></div></div>';
    h += '</div></div>';
    return h;
  }

      var ids = Object.keys(sel).filter(function (k) { return sel[k]; });
      if (ids.length < 2) { toast('至少保留两台设备'); return; }
      th.participants = ids;
      closeSheet();
      renderChat();
      renderApp();
      toast('已更新参与设备');
    });
    focusFirst(sheetLayer);
  }
  function startDownload(name) {
    var d = dev(state.browseDev);
    state.transfers.unshift({ id: 't' + (++state.seq), name: name, size: '4.2 MB', peer: d ? d.name : '设备', dir: 'in', pct: 3, state: 'active' });
    toast('开始下载「' + name + '」到收件目录');
    state.filesSeg = 'transfer';
    renderView();
    renderTabbar();
  }
  function cancelTransfer(id) {
    var t = state.transfers.filter(function (x) { return x.id === id; })[0];
    if (!t) return;
    t.state = 'canceled';
    toast('已取消「' + t.name + '」的传输');
    if (state.tab === 'files' && state.filesSeg === 'transfer') renderView(true);
    renderTabbar();
  }

  /* ── actions ─────────────────────────────────────────────────── */
  function handleAct(act, el) {
    var id = el.getAttribute('data-id');
    var key = el.getAttribute('data-key');
    switch (act) {
      case 'tab': setTab(el.getAttribute('data-tab')); break;
      case 'seg': state.filesSeg = el.getAttribute('data-seg'); renderView(); break;
      case 'open': openConversation(key); break;
      case 'newConvo': openNewConvoSheet(); break;
      case 'refresh': toast('已刷新设备与共享项'); renderApp(); break;
      case 'chatBack': closeConversation(); break;
      case 'chatMore': openChatActions(key); break;
      case 'sendFile': openFilePicker(); break;
      case 'invite': resolveInvite(key, parseInt(el.getAttribute('data-i'), 10), el.getAttribute('data-yes') === '1'); break;
      case 'fileMore': openFileActions(id); break;
      case 'cancelTransfer': cancelTransfer(id); break;
      case 'browseDev': state.browseDev = id; state.browseOpen = {}; renderView(); break;
      case 'browseToggle': {
        var p = el.getAttribute('data-path');
        state.browseOpen[p] = !state.browseOpen[p];
        renderView(true);
        break;
      }
      case 'browseNoop': toast('这是一个空目录'); break;
      case 'downloadNode': startDownload(el.getAttribute('data-name')); break;
      case 'connect': connectDevice(id); break;
      case 'disconnect': disconnectDevice(id); break;
      case 'deviceMore': openDeviceActions(id); break;
      case 'pairOpen': openPairSheet(); break;
      case 'addDevice': openAddDeviceSheet(); break;
      case 'saveSettings': {
        var nm = document.getElementById('setName');
        if (nm) state.settings.name = nm.value.trim() || '我的手机';
        var pt = document.getElementById('setPort');
        if (pt) state.settings.port = pt.value.replace(/\D/g, '') || '3890';
        toast('设置已保存');
        renderApp();
        break;
      }
      case 'closeSheet': closeSheet(); break;
      default: break;
    }
  }

  /* ── transfers tick ──────────────────────────────────────────── */
  function tick() {
    var act = state.transfers.filter(function (t) { return t.state === 'active'; });
    if (!act.length) return;
    act.forEach(function (t) {
      t.pct = Math.min(100, (t.pct || 0) + 4 + Math.random() * 6);
      var row = document.querySelector('.trow[data-tid="' + t.id + '"]');
      if (row) {
        var bar = row.querySelector('.t-bar i');
        if (bar) bar.style.width = Math.round(t.pct) + '%';
        var pctEl = row.querySelector('.t-pct');
        if (pctEl) pctEl.textContent = Math.round(t.pct) + '%';
      }
      if (t.pct >= 100) {
        t.pct = 100;
        t.state = 'done';
        if (t.dir === 'in') {
          if (!state.inbox.some(function (f) { return f.name === t.name; })) {
            state.inbox.unshift({ id: 'f' + (++state.seq), name: t.name, size: t.size, from: t.peer, time: '刚刚', kind: kindOf(t.name) });
          }
          toast('「' + t.name + '」接收完成，已保存到收件目录');
        } else {
          toast('「' + t.name + '」已发送至 ' + t.peer);
        }
        if (state.tab === 'files' && state.filesSeg === 'transfer' && !state.openChat) renderView(true);
        renderTabbar();
      }
    });
  }

  /* ── routing / init ──────────────────────────────────────────── */
  function route() {
    var h = location.hash || '#/convos';
    if (h.indexOf('#/chat/') === 0) {
      var key = h.slice(7);
      try { key = decodeURIComponent(key); } catch (e) { /* keep raw */ }
      if (validConvo(key)) { openSub(key); return; }
      location.hash = '#/' + state.tab;
      return;
    }
    var t = h.replace(/^#\//, '');
    if (['convos', 'files', 'devices', 'settings'].indexOf(t) < 0) t = 'convos';
    state.tab = t;
    closeSub();
    renderApp();
  }
  function init() {
    document.addEventListener('click', function (e) {
      var el = e.target.closest && e.target.closest('[data-act]');
      if (!el) return;
      handleAct(el.getAttribute('data-act'), el);
    });
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape' && sheetLayer.classList.contains('open')) { closeSheet(); return; }
      if (e.key === 'Enter' || e.key === ' ') {
        var el = e.target.closest && e.target.closest('[role="button"][data-act]');
        if (el) { e.preventDefault(); handleAct(el.getAttribute('data-act'), el); }
      }
    });
    scrim.addEventListener('click', closeSheet);
    appmain.addEventListener('input', function (e) {
      if (e.target.id === 'setName') state.settings.name = e.target.value;
      else if (e.target.id === 'setPort') state.settings.port = e.target.value;
    });
    appmain.addEventListener('change', function (e) {
      if (e.target.name === 'dlMode') state.settings.downloadMode = e.target.value;
      var sw = e.target.getAttribute && e.target.getAttribute('data-switch');
      if (sw) state.settings[sw] = e.target.checked;
    });
    window.addEventListener('hashchange', route);
    setInterval(tick, 1000);
    var st = document.getElementById('statusTime');
    if (st) st.textContent = nowHM();
    if (!location.hash) location.hash = '#/convos';
    route();
  }
  init();
})();
</script>
